<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>REEL RUSH</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#080a0f;color:#f4f6fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);touch-action:manipulation}.app{max-width:620px;margin:auto;padding:16px 0 28px}.head{text-align:center}.brand{font-size:10px;letter-spacing:4px;color:#737d8f;font-weight:800}.head h1{font-size:40px;margin:2px 0;font-weight:900}.sub{font-size:12px;color:#687386}.card{background:#10141c;border:1px solid #252c38;border-radius:21px;padding:12px;margin-top:11px}.top{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#0a0d13;border:1px solid #222a36;border-radius:14px;padding:10px 12px}.label{font-size:9px;letter-spacing:1.1px;color:#697386}.value{font-size:20px;font-weight:900;margin-top:3px}.machine{background:#07090d;border:1px solid #303847;border-radius:17px;padding:8px}.reels{height:265px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;overflow:hidden;border-radius:13px}.window{position:relative;overflow:hidden;background:#0d1118;border:1px solid #272f3c;border-radius:11px}.window:after{content:"";position:absolute;left:0;right:0;top:33.333%;height:33.333%;border-top:1px solid #3b4453;border-bottom:1px solid #3b4453;pointer-events:none}.strip{height:900%;display:flex;flex-direction:column;will-change:transform}.sym{height:11.111%;display:grid;place-items:center;font-size:46px}.heart{color:#ff4057}.bets{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.bet,.btn{border:1px solid #303847;background:#181d27;color:#e7ebf3;border-radius:11px;font-weight:900}.bet{min-height:42px;font-size:14px}.bet.active{background:#e9edf4;color:#090b10}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.btn{min-height:50px;font-size:14px}.spin{grid-column:1/-1;background:#e9edf4;color:#090b10;font-size:17px}.btn.active{background:#ffd15a;color:#090b10}.status{text-align:center;min-height:19px;margin-top:8px;color:#727d90;font-size:12px}
</style></head><body><div class="app"><div class="head"><div class="brand">TELEGRAM MINI APP</div><h1>REEL RUSH</h1><div class="sub" id="hello">Добро пожаловать</div></div><div class="card"><div class="top"><div class="stat"><div class="label">BALANCE</div><div class="value" id="balance">1000 ⭐</div></div><div class="stat"><div class="label">BET</div><div class="value" id="betValue">50 ⭐</div></div></div></div><div class="card"><div class="machine"><div class="reels" id="reels"></div></div><div class="bets" id="bets"></div><div class="controls"><button class="btn spin" id="spin">🎰 SPIN</button><button class="btn" id="fast">⚡ FAST SPIN</button><button class="btn" id="auto">🔄 AUTO SPIN</button></div><div class="status" id="status">Готово к спину · валюта ⭐</div></div></div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const S=[["🔔","BELL"],["🍋","LEMON"],["🍀","CLOVER"],["♥","ACE"],["🔥","FIRE"],["💰","GOLD"],["👑","CROWN"],["💎","ROYAL"]],BET=[10,25,50,100,250,500];let bal=1000,bet=50,fast=false,auto=false,busy=false;
const reels=document.getElementById("reels");for(let r=0;r<3;r++){let w=document.createElement("div");w.className="window";let s=document.createElement("div");s.className="strip";[...S,...S,...S].forEach(v=>{let e=document.createElement("div");e.className="sym"+(v[1]=="ACE"?" heart":"");e.textContent=v[0];s.append(e)});w.append(s);reels.append(w)}
const betsEl=document.getElementById("bets");
const spinBtn=document.getElementById("spin");
const fastBtn=document.getElementById("fast");
const autoBtn=document.getElementById("auto");
const balanceEl=document.getElementById("balance");
const betValueEl=document.getElementById("betValue");
const statusEl=document.getElementById("status");
const helloEl=document.getElementById("hello");

BET.forEach(v=>{let b=document.createElement("button");b.className="bet"+(v==bet?" active":"");b.textContent=v+" ⭐";b.onclick=()=>{if(busy)return;bet=v;document.querySelectorAll(".bet").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()};betsEl.append(b)});
function render(){balanceEl.textContent=bal+" ⭐";betValueEl.textContent=bet+" ⭐"}
function wait(n){return new Promise(r=>setTimeout(r,n))}

async function spinGame(){
  if(busy)return;
  if(bal<bet){statusEl.textContent="Недостаточно ⭐";return}
  busy=true;
  bal-=bet;
  render();
  statusEl.textContent="🎰 Барабаны крутятся…";
  let t=[0,1,2].map(()=>Math.floor(Math.random()*S.length));
  let ss=[...document.querySelectorAll(".strip")];
  let h=reels.clientHeight/3;
  for(let i=0;i<3;i++){
    let d=(fast?600:1400)+i*(fast?100:260);
    ss[i].style.transition=`transform ${d}ms cubic-bezier(.12,.8,.2,1)`;
    ss[i].style.transform=`translateY(-${(5*S.length+t[i])*h}px)`;
    await wait(d+30);
  }
  let win=0;
  if(t[0]==t[1]&&t[1]==t[2]){
    win=Math.round(bet*([3.9,3.9,9.8,8.2,3.9,9.8,15.7,15.7][t[0]]));
  } else if(t[0]==t[1]||t[1]==t[2]||t[0]==t[2]){
    let pairIndex=t.findIndex((x,i)=>t.indexOf(x)!=i);
    win=Math.round(bet*([1,1,2.9,4.9,1.5,2.9,3.9,1.5][pairIndex]));
  }
  bal+=win;
  render();
  statusEl.textContent=win?"🎉 WIN +"+win+" ⭐":"Без выигрыша";
  busy=false;
  if(auto){
    await wait(fast?180:500);
    if(auto&&bal>=bet) spinGame();
    else {auto=false;autoBtn.classList.remove("active")}
  }
}

spinBtn.onclick=spinGame;
fastBtn.onclick=()=>{fast=!fast;fastBtn.classList.toggle("active",fast)};
autoBtn.onclick=()=>{auto=!auto;autoBtn.classList.toggle("active",auto);if(auto&&!busy)spinGame()};

let u=tg?.initDataUnsafe?.user;
if(u)helloEl.textContent="Привет, "+(u.first_name||"игрок")+" 👋";
render();
</script></body></html>
